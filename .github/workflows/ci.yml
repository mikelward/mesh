name: CI

# The real test gate this repository's ruleset requires: `fmt · clippy ·
# test` (the `check` job) plus `msrv`. `classify`/`gate`/`lanes` use the
# shared engine at mikelward/lanes — see .github/lanes.conf for the
# docs/code classification that lets a housekeeping-only diff skip the
# heavy jobs without weakening the gate.
#
# TEMPORARY: both `gate` and `lanes` run below. mikelward/lanes renamed its
# consumer-facing check from `gate` to `lanes` (mikelward/lanes#9); this
# repo's ruleset still requires `gate`. Per that project's staged-rename
# procedure, the duplicate keeps `gate` reporting until the ruleset is
# flipped to require `lanes` instead — see TODO.md.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `gate`/`lanes` check run
    # already minted on it — stays put, so a base change must start a fresh
    # run. Title and body edits re-run the lane too, deliberately: a
    # skipped job would be worse, because GitHub counts a skipped required
    # check as satisfied, so skipping the gate on a "harmless" edit would
    # let a newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]
  # A PR opened by GITHUB_TOKEN (mikelward/rust-update's weekly batch)
  # triggers no `on: pull_request` run of its own, so that job dispatches
  # this workflow explicitly, naming the PR it reports for. The `pr` input
  # is required so a bare dispatch is refused at the API level;
  # mikelward/lanes's own dispatch-binding guard is the real check — it
  # also refuses an unnamed dispatch, and additionally proves the named PR
  # actually heads the dispatched commit before classify or gate trusts it
  # (.github/lanes.conf: dispatch-without-pr refuse).
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number this run reports for.
        required: true
        type: string

# CI only builds and tests -- it never writes to the repository, so it runs with
# a read-only token whatever the repo's default workflow permissions happen to
# be set to. That default is a repository SETTING this file cannot see, so
# read-only is declared here rather than assumed.
permissions:
  contents: read
  # The docs lane's classify and gate steps read the PR's files and commits
  # through the workflow token; without this they fail closed into the code
  # lane forever, which looks identical to the lane working. Read-only, and
  # still nothing here can write.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the heavy jobs may skip: true only when every changed
  # file in the PR is housekeeping — root-level markdown that nothing reads
  # (see .github/lanes.conf for the rule; the engine is mikelward/lanes).
  # README.md and the whole docs/ tree are code: docs.rs parses every
  # example in them, transcripts.rs runs the prompted ones, and mesh-core
  # embeds docs/REFERENCE.md with include_str!, so a skip there would skip
  # the very sweeps that read the change. Markdown elsewhere is code for the
  # same reason — being documentation is a matter of where a file lives, and
  # markdown inside a tree can be a build input. Pushes to main are always
  # classified as code, so they run everything.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number || inputs.pr }}

  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config, where anything later in the
          # job -- a build script, a dependency's proc macro -- could read it
          # back out. Nothing here pushes.
          persist-credentials: false

      # Read the pin from rust-toolchain.toml rather than naming a version here,
      # the same way the msrv job reads the floor from Cargo.toml. rustup would
      # install it on the first cargo command anyway; doing it as its own step
      # keeps a toolchain download from looking like a slow build.
      - name: Install the pinned toolchain
        run: |
          channel="$(grep '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The SessionStart hook is what keeps a web session's toolchain able to
      # build this workspace at all, so it gets the same treatment as the Rust
      # code: a suite that runs on every PR. Its own tests stub rustc/rustup,
      # so nothing here downloads a toolchain.
      - name: Shellcheck the hook and the shell suites
        run: |
          shellcheck -s bash -S error .claude/hooks/session-start.sh
          shellcheck -s sh -S error scripts/unshallow.sh
          shellcheck -s sh -S error session_start_hook_test.sh
          shellcheck -s sh -S error makefile_test.sh
          shellcheck -s sh -S error toolchain_test.sh

      # The pin in rust-toolchain.toml is what installs a working compiler on a
      # stale machine, and it only works while it stays at or above the MSRV
      # floor -- which no build failure reports as such.
      - name: Test the toolchain pin
        run: sh toolchain_test.sh

      - name: Test the session-start hook
        run: sh session_start_hook_test.sh

      # The Makefile is the one-line front door to these same commands, and its
      # suite asserts the two agree -- so a gate added above must be added there
      # too, or `make check` quietly stops meaning "what CI runs".
      - name: Test the Makefile
        run: sh makefile_test.sh

      # The `scripts/` suites: the unshallow script and the shim it runs on.
      # The codex-review workflows are checked by the `codex-review-check` job,
      # which compares them byte for byte against mikelward/codex-review's
      # templates and verifies nothing else here holds `statuses: write` --
      # once for all its consumers rather than a copy per repository. All
      # dependency-free, so this needs a runtime and nothing else.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test the JavaScript suites
        run: node --test scripts/*.test.js

      # FreeBSD needs no cross compiler: nothing in the tree builds C for it
      # (`rusqlite` links a system SQLite rather than bundling one), and `cargo
      # check` never reaches the link step where that library would be needed.
      # So this runs before the Zig install rather than depending on it.
      - name: Install FreeBSD target
        run: rustup target add x86_64-unknown-freebsd

      # `mesh-platform` picks the `ioctl` request type per platform, and FreeBSD
      # takes the same branch as Linux by way of `not(macos)` — an arrangement
      # nothing verified until this job, since a BSD-only mistake compiles fine
      # on both runners.
      - name: Check FreeBSD
        run: cargo check --workspace --all-targets --target x86_64-unknown-freebsd

      - name: Install macOS target
        run: rustup target add x86_64-apple-darwin

      - name: Install cross compiler
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1

      # Zig compiles bundled C dependencies; `cargo check` then type-checks all
      # macOS Rust code without needing an Apple linker or a macOS runner.
      - name: Check macOS
        env:
          # cc-rs spells this target `apple-macosx`, which Zig does not accept.
          CC_x86_64_apple_darwin: zig cc -target x86_64-macos
          CRATE_CC_NO_DEFAULTS: "1"
        run: cargo check --workspace --all-targets --target x86_64-apple-darwin

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config, where anything later in the
          # job -- a build script, a dependency's proc macro -- could read it
          # back out. Nothing here pushes.
          persist-credentials: false

      # Build against the floor declared in Cargo.toml rather than trusting the
      # number by hand — the previously declared 1.85 had silently stopped
      # compiling once a dependency required newer Rust.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(grep '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          # A two-component MSRV (1.95) selects rustup's moving 1.95.x channel,
          # which would keep passing on 1.95.1 even if the floor release itself
          # stopped compiling. Append .0 to pin the exact floor.
          case "$version" in *.*.*) ;; *) version="$version.0" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install ${STEPS_MSRV_OUTPUTS_VERSION} --profile minimal
        env:
          STEPS_MSRV_OUTPUTS_VERSION: ${{ steps.msrv.outputs.version }}

      # `+toolchain` overrides the exact release rust-toolchain.toml pins.
      - name: Check
        run: cargo +${STEPS_MSRV_OUTPUTS_VERSION} check --workspace --locked
        env:
          STEPS_MSRV_OUTPUTS_VERSION: ${{ steps.msrv.outputs.version }}

  # rust-toolchain.toml pins an exact release, which buys reproducibility at the
  # cost of never noticing that a new compiler broke something. This job is that
  # notice: it overrides the pin with `+stable` and runs the two gates most
  # likely to move under a new release.
  #
  # Pushes to main only. On pull requests it would mean an upstream release
  # turning someone's unrelated PR red, which teaches everyone to ignore it. A
  # red main is the next task instead, per AGENTS.md.
  stable:
    name: stable (early warning)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config, where anything later in the
          # job -- a build script, a dependency's proc macro -- could read it
          # back out. Nothing here pushes.
          persist-credentials: false

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +stable test --workspace

  # The one check the main ruleset requires today. Always runs, always
  # reports — green only when every heavy job succeeded, or when they were
  # skipped and the skip is INDEPENDENTLY verified as justified: the diff
  # re-derived as housekeeping-only and every commit subject carrying a
  # housekeeping prefix. Any other combination — a failure anywhere, a skip
  # on a code diff, classify itself failing — is an explicit red, never a
  # silent pass. `stable` is not in the needs list on purpose: it is a
  # push-only early-warning job that never reports on a PR, so including it
  # would read as a permanent skip and wedge every code-lane verdict.
  #
  # TEMPORARY, alongside `lanes` below: see the top-of-file comment for the
  # staged-rename this repeats mikelward/lanes#9 for.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, check, msrv]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run, and harmless on a pull_request
          # one, which takes the same commit from its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            check=${{ needs.check.result }}
            msrv=${{ needs.msrv.result }}

  # The renamed check (mikelward/lanes#9) — this is what the ruleset should
  # require once it has reported on a pull_request run here (TODO.md).
  # Identical to `gate` above; see that job's comment for why both exist.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, check, msrv]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run, and harmless on a pull_request
          # one, which takes the same commit from its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            check=${{ needs.check.result }}
            msrv=${{ needs.msrv.result }}
