name: Release

# Releases run only on pushes to main. A manual workflow_dispatch trigger is
# intentionally omitted: dispatch runs the workflow file from the selected ref,
# so a feature branch could execute an older, unguarded copy of this job and
# publish a colliding tag or overwrite release assets. The release version and
# tag are derived from the commit count, so an off-main run can collide with a
# version already released from main. Keeping the trigger off the default branch
# disables manual dispatch for every ref.
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  linux-x86-64:
    if: github.ref == 'refs/heads/main'
    name: Linux x86-64 binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # This job has contents: write and publishes a release; don't
          # leave the token in .git/config, where anything later in the
          # job (a build script, a dependency's proc macro) could read it
          # back out and use it to push or modify the repository.
          persist-credentials: false

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Set release version
        run: |
          # The checkout is detached at the pushed commit. The build script
          # recognizes a released commit by finding it on `origin/main`, so make
          # sure that ref is here rather than relying on how the checkout action
          # happens to lay refs out.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          version="0.0.$(git rev-list --count HEAD)"
          printf 'version=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p mesh

      # The binary derives its own version from the checkout rather than being
      # told (crates/mesh-core/build.rs), which is what lets a developer's clean
      # build of a released commit report the released version. That leaves two
      # derivations of one number, so check them against each other here: a
      # disagreement fails the release instead of shipping a binary that
      # misreports which release it is.
      - name: Check the binary reports the release version
        run: |
          reported=$("target/$TARGET/release/mesh" --version)
          if test "$reported" != "mesh $version"; then
            echo "mesh --version said '$reported', expected 'mesh $version'" >&2
            exit 1
          fi

      - name: Package
        run: |
          archive="mesh-$version-$TARGET.tar.gz"
          staging="mesh-$version-$TARGET"
          mkdir "$staging"
          cp "target/$TARGET/release/mesh" "$staging/"
          cp README.md LICENSE-APACHE LICENSE-MIT "$staging/"
          tar -czf "$archive" "$staging"
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        # zizmor's superfluous-actions audit suggests `gh release create` in
        # a script step instead — kept as the action for now, since its
        # declarative tag_name/target_commitish/generate_release_notes/files
        # inputs are what this job already relies on, and hand-rolling the
        # equivalent `gh` invocation is a real change to the release
        # pipeline, out of scope for this migration.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ env.tag }}
          target_commitish: ${{ github.sha }}
          name: mesh ${{ env.version }}
          generate_release_notes: true
          files: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
