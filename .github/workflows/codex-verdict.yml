# Translates Codex's review verdict into a commit status branch protection
# can require. Codex posts no check run, and a clean pass is only a reaction
# on the PR body — which emits no webhook — so this polls rather than reacting
# to an event. See scripts/codex-verdict.mjs.
#
# Scheduled workflows only run from the default branch, so this does nothing
# until it is merged to main.
name: codex-verdict

# No `workflow_dispatch`, deliberately: it took a ref, and GitHub runs the
# workflow file *from that ref* — so a branch could ship its own version of
# this job, keep the `statuses: write` token, and publish `codex: success`
# for itself. Pinning the checkout doesn't help when the branch supplies the
# steps. `pull_request_target` does not have that hole — GitHub takes the
# workflow definition from the BASE ref, so a PR cannot bring its own sweep —
# and it is what starts the loop the moment a push lands: pushes emit real
# webhooks even though reactions never do.
#
# This sweep is the ONLY writer of the `codex` status, on purpose. A commit
# status belongs to the SHA, so a fresh push fail-closes by absence: the new
# head has no `codex` status, a required check that has never reported
# blocks the merge, and the run this event starts writes `pending` within
# about a minute. An earlier companion workflow (codex-verdict-reset) wrote
# `pending` on the same events a few seconds faster, and that second writer
# was a standing race: its unconditional write, landing unordered against
# this loop, could overwrite a just-published `success` after the run had
# already exited — stranding the verdict on the throttled schedule — and no
# grace period bounds a delayed Actions run. One writer, nothing to order.
# The residual the reset covered — a new PR opened on a SHA that already
# earned `codex: success` inherits it until the first sweep resets it — was
# a race under the reset too (seconds against a minute), and AGENTS.md's
# "never open a PR on a commit that already carried one" is the fix either
# way. A test pins that no other workflow can write commit statuses.
#
# The schedule is the backstop, not the clock, and it is HOURLY on purpose.
# The event starts a run within seconds of a push; the run polls every
# minute (SWEEP_INTERVAL_SECONDS) for up to ~55 minutes (SWEEP_LOOP_MINUTES);
# everything the schedule alone catches is rare and fails CLOSED — a dropped
# webhook leaves the new head pending, a reaction-only change (a 👍 after
# the loop parked, a hold added or removed) waits unread — and every one of
# those is also recoverable on demand, because ANY comment on the PR starts
# a sweep. So the schedule's only job is to self-heal those quietly, and an
# hour is fast enough for a state that cannot merge anything wrongly. (The
# old `*/5` was throttled to a measured median of 14 minutes anyway; no
# short interval buys what it promises.) The concurrency group holds exactly
# one successor queued while a run loops; extra fires beyond the one queued
# slot show up as canceled runs, which is expected and harmless.
#
# The loop is lean: each sweep reports how many heads still await Codex's
# answer, and the run exits as soon as that count reaches zero (see runLoop).
# Awaiting means the next minute can plausibly change the answer — Codex is
# reading, or an answer is due for an event a few minutes old. A head with
# no answer and no 👀 after UNANSWERED_MINUTES parks: Codex answers within
# minutes of the event that woke it or it never started, so a forgotten PR
# with no verdict must not keep every loop alive to its cap forever — the
# retry is a nudge or a push, both events. Everything else waits on a human
# and gets no polling: a `success` merges by auto-merge; findings wait for a
# push; a hold waits for the owner, noticed on the next scheduled fire or
# any comment. So there is a minute clock on every path that leads to a
# merge, and none on the paths that don't. Converting the PR to draft
# remains the instant brake — the sweep skips drafts and auto-merge disarms
# on its own.
#
# The verdict therefore lands within about a minute of Codex's 👍. The rate
# budget holds: a sweep is a handful of API calls, and even a full 55-minute
# run stays a few hundred requests against GITHUB_TOKEN's 1,000/hour — if
# open PRs ever number in the dozens, raise SWEEP_INTERVAL_SECONDS rather
# than the loop length.
#
# Cost: free on this public repo, and designed to stay cheap on a private
# one. GitHub bills each private-repo job's duration rounded UP to a
# minute, so idle scheduled fires are the term that scales: hourly is ~720
# billed minutes a month — around a third of a private plan's 2,000-minute
# free tier — where the `*/15` this replaced was the entire tier by itself.
# The loop's own cost is bounded by UNANSWERED_MINUTES: a push round costs
# the few minutes until Codex answers, a head it never answers costs ~10
# minutes once, and only a genuine in-flight read (👀) can hold a loop to
# its cap. Lengthen the cron further on a private repo if even 720 is too
# much — the schedule only self-heals fail-closed states that any comment
# also clears on demand.
# Comment events too, for the round that has no push: a finding rebutted on
# the same head plus an "@codex review" nudge changes the verdict without a
# single pull_request event, and the reactions that follow emit nothing — so
# without these the re-read would wait on the throttled schedule. Both comment
# events run the workflow definition from the default branch, same as
# schedule. A settled repo pays one lean sweep (seconds) per comment.
on:
  schedule:
    - cron: '23 * * * *'
  # `closed` is here for the shared-head case: two open PRs on one head both
  # publish `failure`, and closing one is the webhook-capable transition that
  # clears the survivor — without it the surviving PR waits on the throttled
  # schedule for a merge-enabling change that already announced itself.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  # `edited` too: a nudge can be edited into an existing comment, and the
  # sweep dates such an ask by its edit time — without the event the re-read
  # would wait on the throttled schedule.
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

# Enough to read the open PRs, read check suites (the head-birth bounds:
# the branch-born suite dates a fast-forward transition the timeline never
# records, and the earliest suite dates a head whose CI writes no commit
# statuses — see checkSuiteBirths; fork heads carry no head_branch on their
# suites, so a fork PR's 👍 never opens this gate — an admin override or a
# same-repo re-push is the path for fork contributions), and write the
# status; nothing else. The sweep has no dependencies to install and runs
# none of the repo's own code, so the write scope never sits in the same
# process as anything third-party.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

concurrency:
  group: codex-verdict
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # A hung API call inside the loop would otherwise hold the runner to the
    # 6-hour job default — and with it the concurrency queue, stalling the
    # gate silently. Ten minutes past the loop length is enough for any real
    # iteration to finish.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          # Pinned to the default branch explicitly. A scheduled run is
          # already there; a pull_request_target run takes its workflow
          # definition from the base ref but would check out the base of
          # *that PR* — main today, and the pin keeps it main if a PR ever
          # targets another branch. Never the PR head: this job runs with a
          # token that can write `codex: success`, so it must only ever run
          # code that is already on the default branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # A bare major, not a `.nvmrc`: mesh is a Rust workspace and ships no
      # Node runtime, so there is nothing here for a version file to be the
      # single source of truth *for*. JavaScript is only the language the
      # sweep is written in — it has no dependencies, and the runner image
      # supplies the rest. Pinned rather than left to whatever the image
      # ships so an image bump cannot change what the gate runs on;
      # `codex-verdict.test.js` pins that ci.yml, which runs this script's
      # suite, asks for the same major.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/codex-verdict.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEP_LOOP_MINUTES: "55"
          SWEEP_INTERVAL_SECONDS: "60"
