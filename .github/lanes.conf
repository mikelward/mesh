# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# Translated from scripts/docs-lane.sh's is_housekeeping()/LANE_PREFIXES/
# dispatch_without_pr_ok(), which this policy replaces — see the migration
# this file lands with.
#
# The lane's test is "can this change what CI validates?". Markdown is docs
# wherever it lives OUTSIDE the crate trees — prose cannot change a build,
# categorically — while anything under crates/ is a build input whatever its
# extension (cargo packages a crate's README into the published artifact,
# and include_str! can embed any file). crates/** is checked first so a
# markdown file under crates/ never rides the docs lane before that rule
# gets a chance to say otherwise. Everything else is code: the session hook
# under .claude/ (CI lints and tests it), workflows, and any executable
# configuration.
code crates/**
docs **/*.md

# The subject prefixes this repo's commit conventions give housekeeping
# commits (see AGENTS.md "Commit messages"). On the docs lane every commit
# must carry one, so nothing riding it reads like a bare behavior-change
# subject.
prefixes design docs todo test build refactor

# lint-title left at its default (yes): AGENTS.md's "Branching" already
# requires the PR title to carry the same prefix as a commit subject,
# judged over the whole branch, so linting the title too matches existing
# repo convention rather than adding a new requirement.

# ci.yml's workflow_dispatch exists for mikelward/rust-update's
# belt-and-suspenders fallback dispatch (see rust-update.yml's "Belt-and-
# suspenders fallback" comment) and for manual `gh workflow run`, and both
# always name the pull request they report for — so a PR-less dispatch is
# never legitimate, on any ref.
dispatch-without-pr refuse
