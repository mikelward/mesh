# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# Translated from scripts/docs-lane.sh's is_housekeeping()/LANE_PREFIXES/
# dispatch_without_pr_ok(), which this policy replaces — see the migration
# this file lands with.
#
# The lane's test is "can this change what CI validates?". Prose cannot
# change a build — but *these* docs are not only prose to this suite, which
# is the trap the lanes README warns every consumer about. `docs.rs` parses
# every example in `README.md` and every `docs/*.md`, `transcripts.rs` runs
# the prompted ones and compares mesh's diagnostics against what each shows,
# and `mesh-core` embeds `docs/REFERENCE.md` with `include_str!` and asserts
# the builtin table against it — so REFERENCE.md is a compile input as well
# as a read one. A docs-only skip on any of them lets an example that
# stopped working merge green, and breaks the next code pull request on
# prose it never touched.
#
# So the whole `docs/` tree and `README.md` are code. The tree rather than
# the swept files by name, because both sweeps enumerate `docs/` with
# `read_dir` rather than a list: a new file there joins the sweep the moment
# it lands, and naming today's files would put it on the lane that skips the
# sweep it just joined. `DESIGN.md` and `TYPES.md` are exempt *inside* the
# sweep and stay on the code lane with the rest of the tree — the exemption
# is a named list the suite asserts is exactly two files wide, and encoding
# it here too would be a second copy to drift.
#
# Anything under crates/** is a build input whatever its extension (cargo
# packages a crate's README into the published artifact, and include_str!
# can embed any file), so it is checked first.
code crates/**
code README.md
code docs/**
# What is left is root markdown that nothing reads: AGENTS.md, TODO.md,
# ROADMAP.md, DEVELOPMENT.md, GRAMMAR.md and their neighbors. `*.md` does
# not cross `/`, so it reaches the root and no further — a bare `**/*.md`
# would be the old mistake in a wider form, making a markdown build input
# documentation at any depth. `docs.rs`'s `every_swept_document_is_code`
# asserts both directions of this against the file you are reading.
docs *.md

# The subject prefixes this repo's commit conventions give housekeeping
# commits (see AGENTS.md "Commit messages"). On the docs lane every commit
# must carry one, so nothing riding it reads like a bare behavior-change
# subject.
prefixes design docs todo test build refactor

# The pull request title is never linted. The reasoning this replaces was
# that AGENTS.md already required the title to carry a commit subject's
# prefix -- true, but that convention is for reading the PR list, and squash
# merging is disabled on every repository in this fleet, so a title never
# becomes a commit subject. Linting it held titles to a rule that decides
# nothing reaching `main`; only the commit prefixes above do that. AGENTS.md
# now states the convention as a convention.
lint-title no

# ci.yml's workflow_dispatch exists for mikelward/rust-update's
# belt-and-suspenders fallback dispatch (see rust-update.yml's "Belt-and-
# suspenders fallback" comment) and for manual `gh workflow run`, and both
# always name the pull request they report for — so a PR-less dispatch is
# never legitimate, on any ref.
dispatch-without-pr refuse
