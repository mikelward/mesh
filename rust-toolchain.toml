# Track current stable so contributors and CI use the same channel and pick up
# fixes automatically. This floats rather than pinning an exact release: CI runs
# every PR against both current stable and the MSRV floor, so new-compiler or
# Clippy breakage surfaces immediately. Pin an exact `major.minor.patch` here if
# reproducibility ever needs to be exact.
#
# `rust-version` in Cargo.toml records the supported MSRV floor, which the `msrv`
# CI job builds against so the declared number cannot drift from what compiles.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
