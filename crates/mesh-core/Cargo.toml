[package]
name = "mesh-core"
version.workspace = true
description = "Core lexer, expansion, and runtime for the mesh shell."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono = "0.4.44"
# The version reedline itself builds against, so the key-event types unify.
crossterm = "0.29.0"
glob = "0.3.3"
libc = "0.2.186"
mesh-platform = { path = "../mesh-platform" }
nucleo-matcher = "0.3.1"
nu-ansi-term = "0.50.3"
reedline = { version = "0.50.0", default-features = false, features = ["sqlite"] }
regex = "1.11.3"
rusqlite = "0.40.1"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
